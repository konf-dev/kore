[package]
name = "kore-runtime"
version = "0.1.0"
edition = "2021"
description = "HTTP server for Kore execution with tracing (for RL training)"

[[bin]]
name = "kore-runtime"
path = "src/main.rs"

[dependencies]
# Core Kore
kore = { path = "../../../" }

# Web server
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
