[package]
name = "kore"
version = "0.1.0"
edition = "2021"
description = "The fundamental runtime - a stack-based execution engine"
license = "MIT"

[dependencies]
async-trait = "0.1"
indexmap = { version = "2.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "test-util"] }
