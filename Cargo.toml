[workspace]
members = [
    "crates/kore-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/konf-dev/kore"

[workspace.dependencies]
# Internal
kore = { path = "." }

# External - only what's actually used
async-trait = "0.1"
indexmap = { version = "2.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.11", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"

[package]
name = "kore"
version.workspace = true
edition.workspace = true
description = "The fundamental runtime - a stack-based execution engine"
license.workspace = true

[dependencies]
async-trait = "0.1"
indexmap = { version = "2.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["sync", "rt-multi-thread", "macros", "fs", "io-util", "process", "time"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "test-util"] }

[[bin]]
name = "kore"
path = "src/bin/kore.rs"
