[package]
name = "kore-bytecode"
version = "0.1.0"
edition = "2021"
description = "Stack-based bytecode VM with JIT and GPU backends"
repository = "https://github.com/konf-dev/kore"
license = "MIT"

[lib]
path = "src/bytecode.rs"

[[bin]]
name = "korec"
path = "src/main.rs"

[features]
default = ["gpu", "native"]
gpu = ["wgpu", "pollster", "bytemuck"]
native = ["cranelift-codegen", "cranelift-frontend", "cranelift-module", "cranelift-native", "cranelift-jit"]

[dependencies]
# GPU runtime (optional, enabled by default)
wgpu = { version = "0.19", optional = true }
pollster = { version = "0.3", optional = true }
bytemuck = { version = "1.14", features = ["derive"], optional = true }

# Native codegen (optional, enabled by default)
cranelift-codegen = { version = "0.111", optional = true }
cranelift-frontend = { version = "0.111", optional = true }
cranelift-module = { version = "0.111", optional = true }
cranelift-native = { version = "0.111", optional = true }
cranelift-jit = { version = "0.111", optional = true }

[dev-dependencies]
