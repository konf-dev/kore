<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kore Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0a0a;
            --surface: #111;
            --surface-2: #1a1a1a;
            --border: #222;
            --text: #e5e5e5;
            --text-dim: #666;
            --accent: #10b981;
            --accent-dim: #064e3b;
            --warn: #f59e0b;
            --error: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
        }
        .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace; }
        
        /* Layout */
        .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
        .grid { display: grid; gap: 16px; }
        .grid-2 { grid-template-columns: repeat(2, 1fr); }
        .grid-3 { grid-template-columns: repeat(3, 1fr); }
        .grid-4 { grid-template-columns: repeat(4, 1fr); }
        @media (max-width: 900px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; } }
        
        /* Header */
        header {
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 100;
        }
        .logo { font-size: 18px; font-weight: 600; letter-spacing: -0.5px; }
        .logo span { color: var(--accent); }
        .status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 13px;
            background: var(--surface);
            border: 1px solid var(--border);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-dim);
        }
        .status-dot.running { background: var(--accent); animation: pulse 2s infinite; }
        .status-dot.paused { background: var(--warn); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        
        /* Cards */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }
        .card-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-body { padding: 16px; }
        .card-body.no-pad { padding: 0; }
        
        /* Stats */
        .stat { text-align: center; padding: 16px; }
        .stat-value { font-size: 32px; font-weight: 600; color: var(--accent); }
        .stat-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; margin-top: 4px; }
        
        /* Buttons */
        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-primary:hover { background: #34d399; }
        .btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--border); }
        .btn-danger { background: var(--error); color: #fff; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-group { display: flex; gap: 8px; }
        
        /* Tool List */
        .tool-item {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.1s;
        }
        .tool-item:last-child { border-bottom: none; }
        .tool-item:hover { background: var(--surface-2); cursor: pointer; }
        .tool-name { font-weight: 500; font-size: 14px; }
        .tool-stats { display: flex; gap: 16px; font-size: 12px; color: var(--text-dim); }
        .tool-stats span { display: flex; align-items: center; gap: 4px; }
        .tool-stats .calls { color: var(--accent); }
        .tool-stats .fails { color: var(--error); }
        .tool-sig { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
        
        /* Tags */
        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
        }
        .tag-ok { background: var(--accent-dim); color: var(--accent); }
        .tag-warn { background: #78350f; color: var(--warn); }
        .tag-error { background: #7f1d1d; color: var(--error); }
        
        /* Input */
        .input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
        }
        .input:focus { outline: none; border-color: var(--accent); }
        textarea.input { resize: vertical; min-height: 80px; }
        
        /* Logs */
        .logs {
            font-family: 'SF Mono', monospace;
            font-size: 12px;
            line-height: 1.6;
            padding: 16px;
            background: var(--bg);
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        
        /* Tabs */
        .tabs { display: flex; border-bottom: 1px solid var(--border); }
        .tab {
            padding: 12px 20px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-dim);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: all 0.15s;
        }
        .tab:hover { color: var(--text); }
        .tab.active { color: var(--accent); border-color: var(--accent); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* Agent Status */
        .agent-status { padding: 16px; }
        .agent-status h3 { font-size: 14px; margin-bottom: 8px; }
        .agent-status p { color: var(--text-dim); font-size: 13px; margin-bottom: 12px; }
        .capabilities { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .capability {
            padding: 4px 10px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 12px;
        }
        
        /* Empty State */
        .empty { padding: 32px; text-align: center; color: var(--text-dim); font-size: 13px; }
        
        /* Modal */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow: hidden;
        }
        .modal-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-body { padding: 16px; overflow-y: auto; max-height: 60vh; }
        .close { cursor: pointer; font-size: 20px; color: var(--text-dim); }
        .close:hover { color: var(--text); }
    </style>
</head>
<body>
    <header>
        <div class="logo"><span>◆</span> Kore</div>
        <div style="display: flex; align-items: center; gap: 16px;">
            <div class="status-pill">
                <div class="status-dot" id="status-dot"></div>
                <span id="status-text">Stopped</span>
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" id="btn-start" onclick="start()">Start</button>
                <button class="btn btn-secondary" id="btn-pause" onclick="pause()" disabled>Pause</button>
                <button class="btn btn-danger" id="btn-stop" onclick="stop()" disabled>Stop</button>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- Stats Row -->
        <div class="grid grid-4" style="margin-bottom: 16px;">
            <div class="card">
                <div class="stat">
                    <div class="stat-value" id="stat-tools">0</div>
                    <div class="stat-label">Tools</div>
                </div>
            </div>
            <div class="card">
                <div class="stat">
                    <div class="stat-value" id="stat-calls">0</div>
                    <div class="stat-label">Total Calls</div>
                </div>
            </div>
            <div class="card">
                <div class="stat">
                    <div class="stat-value" id="stat-iteration">0</div>
                    <div class="stat-label">Iteration</div>
                </div>
            </div>
            <div class="card">
                <div class="stat">
                    <div class="stat-value" id="stat-success">-</div>
                    <div class="stat-label">Success Rate</div>
                </div>
            </div>
        </div>

        <div class="grid grid-2">
            <!-- Left Column: Tools -->
            <div class="card">
                <div class="card-header">
                    <span>Agent Tools</span>
                    <button class="btn btn-secondary" onclick="refreshStorage()" style="padding: 4px 8px; font-size: 11px;">Refresh</button>
                </div>
                <div class="card-body no-pad" id="tools-list">
                    <div class="empty">No tools yet. Start an experiment to begin.</div>
                </div>
            </div>

            <!-- Right Column: Status & Logs -->
            <div class="card">
                <div class="tabs">
                    <div class="tab active" onclick="showTab('status')">Status</div>
                    <div class="tab" onclick="showTab('logs')">Logs</div>
                    <div class="tab" onclick="showTab('chat')">Chat</div>
                </div>
                
                <div id="tab-status" class="tab-content active">
                    <div class="agent-status" id="agent-status">
                        <div class="empty">Agent status will appear here once running.</div>
                    </div>
                </div>
                
                <div id="tab-logs" class="tab-content">
                    <div class="logs" id="logs-content">Waiting for experiment...</div>
                </div>
                
                <div id="tab-chat" class="tab-content">
                    <div style="padding: 16px;">
                        <textarea class="input" id="chat-input" placeholder="Send a message to the agent..."></textarea>
                        <button class="btn btn-primary" onclick="sendChat()" style="margin-top: 8px; width: 100%;">Send</button>
                    </div>
                    <div id="chat-messages" style="padding: 0 16px 16px;"></div>
                </div>
            </div>
        </div>

        <!-- Run Info -->
        <div class="card" style="margin-top: 16px;">
            <div class="card-header">
                <span>Experiment</span>
                <span id="run-id" class="mono" style="font-size: 11px; color: var(--text-dim);">-</span>
            </div>
            <div class="card-body" style="padding: 12px 16px;">
                <div style="display: flex; gap: 24px; font-size: 13px;">
                    <div><span style="color: var(--text-dim);">Model:</span> <span id="model-name">-</span></div>
                    <div><span style="color: var(--text-dim);">Mode:</span> <span id="mode-name">-</span></div>
                    <div><span style="color: var(--text-dim);">Container:</span> <span id="container-name" class="mono">-</span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tool Detail Modal -->
    <div class="modal" id="tool-modal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modal-title" class="mono">Tool</span>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <pre id="modal-content" class="mono" style="font-size: 12px; white-space: pre-wrap;"></pre>
            </div>
        </div>
    </div>

    <script>
        let currentTab = 'status';
        let pollInterval = null;

        // API helper
        async function api(path, method = 'GET', body = null) {
            const opts = { method, headers: { 'Content-Type': 'application/json' } };
            if (body) opts.body = JSON.stringify(body);
            const res = await fetch('/api/' + path, opts);
            return res.json();
        }

        // Tab switching
        function showTab(name) {
            currentTab = name;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelector(`.tab:nth-child(${name === 'status' ? 1 : name === 'logs' ? 2 : 3})`).classList.add('active');
            document.getElementById('tab-' + name).classList.add('active');
            if (name === 'logs') refreshLogs();
        }

        // Status update
        async function updateStatus() {
            const data = await api('status');
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');
            
            dot.className = 'status-dot';
            if (data.running && !data.paused) {
                dot.classList.add('running');
                text.textContent = 'Running';
            } else if (data.paused) {
                dot.classList.add('paused');
                text.textContent = 'Paused';
            } else {
                text.textContent = 'Stopped';
            }

            document.getElementById('btn-start').disabled = data.running && !data.paused;
            document.getElementById('btn-pause').disabled = !data.running || data.paused;
            document.getElementById('btn-stop').disabled = !data.running;
            
            document.getElementById('run-id').textContent = data.run_id || '-';
            document.getElementById('model-name').textContent = data.model || '-';
            document.getElementById('mode-name').textContent = data.kore_only ? 'Kore Only' : 'Kore vs Baseline';
            document.getElementById('container-name').textContent = data.kore?.container || '-';
        }

        // Storage/Tools
        async function refreshStorage() {
            const data = await api('storage');
            const list = document.getElementById('tools-list');
            
            if (data.error || !data.rom?.keys || Object.keys(data.rom.keys).length === 0) {
                list.innerHTML = '<div class="empty">No tools yet. Start an experiment to begin.</div>';
                document.getElementById('stat-tools').textContent = '0';
                document.getElementById('stat-calls').textContent = '0';
                document.getElementById('stat-success').textContent = '-';
                return;
            }

            const tools = Object.entries(data.rom.keys).filter(([k, v]) => v.type === 'tool');
            const totalCalls = tools.reduce((sum, [k, v]) => sum + (v.calls || 0), 0);
            const totalFails = tools.reduce((sum, [k, v]) => sum + (v.failures || 0), 0);
            const successRate = totalCalls > 0 ? Math.round((totalCalls - totalFails) / totalCalls * 100) : 100;

            document.getElementById('stat-tools').textContent = tools.length;
            document.getElementById('stat-calls').textContent = totalCalls;
            document.getElementById('stat-success').textContent = successRate + '%';

            if (tools.length === 0) {
                list.innerHTML = '<div class="empty">No tools yet.</div>';
                return;
            }

            list.innerHTML = tools.sort((a, b) => (b[1].calls || 0) - (a[1].calls || 0)).map(([key, info]) => {
                const statusClass = info.status === 'ok' ? 'tag-ok' : info.status === 'warn' ? 'tag-warn' : 'tag-error';
                return `
                    <div class="tool-item" onclick="viewTool('${key}')">
                        <div>
                            <div class="tool-name">${info.name || key}</div>
                            ${info.sig ? `<div class="tool-sig mono">${esc(info.sig)}</div>` : ''}
                        </div>
                        <div class="tool-stats">
                            <span class="calls">${info.calls || 0} calls</span>
                            ${info.failures > 0 ? `<span class="fails">${info.failures} fails</span>` : ''}
                            <span class="tag ${statusClass}">${info.status || 'ok'}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function viewTool(key) {
            const data = await api('storage/rom/' + key);
            document.getElementById('modal-title').textContent = key;
            document.getElementById('modal-content').textContent = JSON.stringify(data.content, null, 2);
            document.getElementById('tool-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('tool-modal').classList.remove('active');
        }

        // Agent Status
        async function refreshAgentStatus() {
            const data = await api('agent-status');
            const el = document.getElementById('agent-status');
            
            if (!data.status) {
                el.innerHTML = '<div class="empty">Agent hasn\'t reported status yet.</div>';
                return;
            }

            const s = data.status;
            document.getElementById('stat-iteration').textContent = s.iteration || 0;

            el.innerHTML = `
                <h3>Current Focus</h3>
                <p>${esc(s.current_focus || 'No focus set')}</p>
                
                ${s.growth_notes ? `<h3 style="margin-top: 16px;">Growth Notes</h3><p>${esc(s.growth_notes)}</p>` : ''}
                
                ${s.recent_learnings?.length ? `
                    <h3 style="margin-top: 16px;">Recent Learnings</h3>
                    <ul style="margin-left: 20px; color: var(--text-dim); font-size: 13px;">
                        ${s.recent_learnings.map(l => `<li>${esc(l)}</li>`).join('')}
                    </ul>
                ` : ''}
                
                ${s.capabilities?.length ? `
                    <h3 style="margin-top: 16px;">Capabilities</h3>
                    <div class="capabilities">
                        ${s.capabilities.map(c => `<span class="capability">${esc(c)}</span>`).join('')}
                    </div>
                ` : ''}
                
                <div style="margin-top: 16px; font-size: 11px; color: var(--text-dim);">
                    Updated: ${s.updated_at ? new Date(s.updated_at * 1000).toLocaleString() : 'Unknown'}
                </div>
            `;
        }

        // Logs
        async function refreshLogs() {
            const data = await api('logs/kore?lines=100');
            document.getElementById('logs-content').textContent = data.logs || '(no logs)';
        }

        // Chat
        async function sendChat() {
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if (!msg) return;
            
            input.value = '';
            addChatMessage('You', msg);
            await api('chat', 'POST', { message: msg, agent: 'kore' });
            pollForResponse();
        }

        function addChatMessage(from, text) {
            const el = document.getElementById('chat-messages');
            el.innerHTML = `
                <div style="margin-bottom: 12px;">
                    <div style="font-size: 11px; color: var(--text-dim); margin-bottom: 4px;">${from}</div>
                    <div style="font-size: 13px;">${esc(text)}</div>
                </div>
            ` + el.innerHTML;
        }

        async function pollForResponse() {
            for (let i = 0; i < 60; i++) {
                await new Promise(r => setTimeout(r, 2000));
                const data = await api('chat/kore/response');
                if (data.done && data.response) {
                    addChatMessage('Kore', data.response);
                    break;
                }
            }
        }

        // Controls
        async function start() {
            const model = prompt('Model:', 'anthropic/claude-sonnet-4');
            if (!model) return;
            document.getElementById('btn-start').disabled = true;
            await api('start', 'POST', { model, kore_only: true });
            startPolling();
            updateStatus();
        }

        async function pause() {
            await api('pause', 'POST');
            updateStatus();
        }

        async function stop() {
            if (!confirm('Stop experiment?')) return;
            await api('stop', 'POST');
            stopPolling();
            updateStatus();
            refreshStorage();
        }

        function startPolling() {
            stopPolling();
            pollInterval = setInterval(() => {
                updateStatus();
                refreshStorage();
                refreshAgentStatus();
                if (currentTab === 'logs') refreshLogs();
            }, 3000);
        }

        function stopPolling() {
            if (pollInterval) clearInterval(pollInterval);
        }

        // Escape HTML
        function esc(s) {
            if (!s) return '';
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // Keyboard
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeModal();
            if (e.key === 'Enter' && e.target.id === 'chat-input' && !e.shiftKey) {
                e.preventDefault();
                sendChat();
            }
        });

        // Init
        updateStatus();
        refreshStorage();
        refreshAgentStatus();
        setInterval(updateStatus, 5000);
    </script>
</body>
</html>
